# ========================================================
# Conexión a la base de datos MySQL (con soporte UTF-8)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/socioclub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Cordoba&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Configuración de JPA / Hibernate
# ========================================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========================================================
# Carga de datos iniciales (data.sql en UTF-8)
# ========================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ========================================================
# Codificación del Servidor Web Tomcat / Thymeleaf
# ========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true